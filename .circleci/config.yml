version: 2.1
orbs:
  architect: giantswarm/architect@10.4.2

workflows:
  build:
    jobs:
      - architect/go-test:
          name: go-test-gitsemver
          # Needed to trigger job also on git tag.
          filters:
            # Trigger job also on git tag.
            tags:
              only: /^v.*/
      - architect/go-build:
          binary: gitsemver
          architectures: "linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64"
          context: architect
          requires:
            - go-test-gitsemver
          filters:
            tags:
              only: /^v.*/
      - architect/upload-release-assets:
          binary: gitsemver
          context: architect
          requires:
            - architect/go-build
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
